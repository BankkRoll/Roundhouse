name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs are cancelled; every commit on main keeps a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Node (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  go:
    name: Go (vet, test, staticcheck, cross-build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      STATICCHECK_VERSION: v0.8.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: List workspace modules
        id: modules
        run: |
          modules="$(go work edit -json | jq -r '.Use[].DiskPath' | tr '\n' ' ')"
          echo "Workspace modules: $modules"
          echo "list=$modules" >> "$GITHUB_OUTPUT"
      - name: gofmt
        env:
          MODULES: ${{ steps.modules.outputs.list }}
        run: |
          status=0
          for m in $MODULES; do
            unformatted="$(cd "$m" && gofmt -l .)"
            if [ -n "$unformatted" ]; then
              echo "::error::gofmt needed in $m: $unformatted"
              status=1
            fi
          done
          exit "$status"
      - name: go mod tidy
        env:
          MODULES: ${{ steps.modules.outputs.list }}
        run: |
          for m in $MODULES; do
            echo "::group::go mod tidy -diff $m"
            (cd "$m" && go mod tidy -diff)
            echo "::endgroup::"
          done
      - name: go vet
        env:
          MODULES: ${{ steps.modules.outputs.list }}
        run: |
          for m in $MODULES; do
            echo "::group::go vet $m"
            (cd "$m" && go vet ./...)
            echo "::endgroup::"
          done
      - name: go test -race
        env:
          MODULES: ${{ steps.modules.outputs.list }}
        run: |
          for m in $MODULES; do
            echo "::group::go test $m"
            (cd "$m" && go test -race ./...)
            echo "::endgroup::"
          done
      - name: staticcheck
        env:
          MODULES: ${{ steps.modules.outputs.list }}
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          for m in $MODULES; do
            echo "::group::staticcheck $m"
            (cd "$m" && "$(go env GOPATH)/bin/staticcheck" ./...)
            echo "::endgroup::"
          done
      - name: Cross-build agent
        working-directory: agent
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=ci-${GITHUB_SHA::12}" \
              -o "bin/roundhouse-agent-linux-$arch" ./cmd/roundhouse-agent
          done
          file bin/roundhouse-agent-linux-*

  protocol-drift:
    name: Protocol schema and fixture drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @roundhouse/protocol gen:schema
      - run: pnpm --filter @roundhouse/protocol gen:fixtures
      - name: Fail on uncommitted generated changes
        run: |
          git add -N packages/protocol
          if ! git diff --exit-code packages/protocol; then
            echo "::error::Generated protocol schema/fixtures are stale. Run 'pnpm --filter @roundhouse/protocol gen:schema' and 'gen:fixtures' and commit the result."
            exit 1
          fi

  migrations-drift:
    name: Database migration drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @roundhouse/db generate
      - name: Fail if the schema has ungenerated migrations
        run: |
          changes="$(git status --porcelain --untracked-files=all packages/db/migrations)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::packages/db schema has changes without a migration. Run 'pnpm --filter @roundhouse/db generate' and commit the result."
            exit 1
          fi

  agent-integration:
    name: Agent integration (Docker, Caddy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run agent integration tests against the runner's Docker Engine
        run: bash agent/test/integration.sh -count=1 -race

  e2e-agent-smoke:
    name: E2E (real agent + browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: pnpm install --frozen-lockfile
      # wrangler dev refuses to start without assets.directory (apps/web/dist).
      - run: pnpm --filter @roundhouse/web build
      - run: node e2e/agent-smoke.mjs
      - run: pnpm --filter @roundhouse/e2e exec playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: pnpm --filter @roundhouse/e2e test:browser
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  e2e-phase1:
    name: E2E Phase 1 (wrangler dev + agent + Docker, BuildKit, registry, Caddy)
    runs-on: ubuntu-24.04
    # Cold Railpack builds pull a few hundred MB; a warm run takes ~5 minutes.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @roundhouse/e2e exec playwright install --with-deps chromium
      # Ubuntu 24.04, and so this runner, restricts unprivileged user
      # namespaces with AppArmor, which stops rootless BuildKit. This runs
      # the installer's own step, and the agent then finds the profile the
      # way it does on a real node.
      - name: Load the BuildKit AppArmor profile as install.sh does
        run: |
          sudo bash -c 'ROUNDHOUSE_INSTALL_SOURCE_ONLY=1 . install/install.sh && install_buildkit_apparmor'
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            sudo grep -E '^roundhouse-buildkit ' /sys/kernel/security/apparmor/profiles ||
              { echo "::error::roundhouse-buildkit is not loaded although the restriction is on"; exit 1; }
          fi
      - name: Phase 1 end-to-end suite
        env:
          CI: "true"
        run: pnpm --filter @roundhouse/e2e test:phase1
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-phase1-artifacts
          path: e2e/phase1/.artifacts
          include-hidden-files: true
          retention-days: 7

  shellcheck:
    name: ShellCheck (install scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck install/*.sh
        run: |
          shopt -s nullglob
          scripts=(install/*.sh install/test/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No install scripts found."
            exit 0
          fi
          shellcheck --version
          shellcheck "${scripts[@]}"
      - name: Embedded systemd unit matches install/roundhouse-agent.service
        run: |
          if ! diff -u install/roundhouse-agent.service \
               <(sed -n "/<<'UNIT'/,/^UNIT$/p" install/install.sh | sed '1d;$d'); then
            echo "::error::install/install.sh embeds a different unit than install/roundhouse-agent.service; copy the file into the heredoc."
            exit 1
          fi

  install-cli-script:
    name: install-cli.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install from a fake signed release
        run: bash install/test/install-cli-test.sh

  install-script:
    name: install.sh (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:22.04", "debian:12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Build agent
        working-directory: agent
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=0.0.0-ci" \
            -o ../dist/roundhouse-agent-linux-amd64 ./cmd/roundhouse-agent
      - name: Installer pins match the agent's builder
        working-directory: agent
        run: go test -count=1 -run TestInstallScriptPins ./internal/builder/
      # Installs Caddy (Cloudsmith) and Railpack (GitHub releases) for real,
      # runs install.sh as a builder, then re-runs it to check idempotency.
      - name: Run install.sh in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/src:ro" -v "$PWD/dist:/dist:ro" \
            "$IMAGE" bash /src/install/test/container-test.sh

  cli:
    name: CLI (vet, test, staticcheck, govulncheck, cross-build, API contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      STATICCHECK_VERSION: v0.8.2
      GOVULNCHECK_VERSION: v1.9.0
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed in cli: $unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: staticcheck
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: shellcheck scripts
        run: shellcheck scripts/*.sh
      - name: Cross-build (linux, darwin, windows × amd64, arm64) with SHA256SUMS
        run: VERSION="0.0.0-ci+${GITHUB_SHA::12}" bash scripts/build.sh
      # The snapshot lets the contract test run offline; here it is
      # regenerated from the API source so a removed or renamed route fails
      # the build even before the snapshot is refreshed.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: API contract (routes and wire types vs. the current OpenAPI document)
        run: |
          bash scripts/gen-openapi.sh
          go test -count=1 -run 'OpenAPI|Schema' ./internal/api/
          if ! git diff --quiet -- internal/api/testdata/openapi.json; then
            echo "::warning::cli/internal/api/testdata/openapi.json is stale; run cli/scripts/gen-openapi.sh and commit the result."
          fi
