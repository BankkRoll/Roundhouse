packages:
  - apps/*
  - packages/*
  - e2e
onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp
# NOTE: jsdom 30 (an auto-installed vitest peer) asks for undici 8, which
# requires Node >=22.19. Holding undici on 7 keeps installs and test runs
# working on older 22.x patch releases; miniflare itself already pins 7.x.
overrides:
  undici: "^7.30.1"
  # NOTE: a transitive dependency resolved zod 4.6.5, below the fix for
  # GHSA-mrhx-c7xc-m3w5 (memory exhaustion on oversized input).
  zod: "^4.6.7"
